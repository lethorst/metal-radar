name: Update metal content

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser==6.0.11 requests==2.32.4

      - name: Fetch news and releases
        run: python scripts/update_content.py

      - name: Commit updated data
        run: |
          git config user.name "Metal Radar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No content changes."
          else
            git commit -m "Update metal news and releases"
            git push
          fi
